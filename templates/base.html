<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ title or "FitBuddy" }}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        <a href="/">FitBuddy</a>
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/view-all-users">
            Dashboard
        </a>

        <a href="/docs">
            API Docs
        </a>

    </nav>

</header>


<main class="page-container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        FitBuddy &copy; 2026
    </p>

    <p>
        AI-powered fitness planning
    </p>

</footer>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>

</html>
